name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bits-and-bots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Audit Python dependencies
        run: uv run --no-sync pip-audit

      - name: Lint python
        run: uv run --no-sync ruff check src tests scripts

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Compile application and scripts
        run: uv run --no-sync python -m compileall -q src tests scripts

      - name: Build production Docker image
        run: docker build --tag bits-and-bots:${{ github.sha }} .
